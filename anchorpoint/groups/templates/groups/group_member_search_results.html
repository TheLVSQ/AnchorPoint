{% if results %}
<ul class="row-list row-list--compact">
{% for result in results %}
    <li class="row-list__item">
        <div class="row-list__main"><strong>{{ result.person.first_name }} {{ result.person.last_name }}</strong></div>
        <form method="post" action="{% url 'groups:member_add' group.pk %}"
              hx-post="{% url 'groups:member_add' group.pk %}" hx-target="#member-list" hx-swap="outerHTML">
            {% csrf_token %}
            <input type="hidden" name="person_id" value="{{ result.person.pk }}">
            <button type="submit" class="btn ghost btn-sm">Add</button>
        </form>
        {% if result.household %}
        <form method="post" action="{% url 'groups:member_add' group.pk %}"
              hx-post="{% url 'groups:member_add' group.pk %}" hx-target="#member-list" hx-swap="outerHTML">
            {% csrf_token %}
            <input type="hidden" name="household_id" value="{{ result.household.pk }}">
            <button type="submit" class="btn ghost btn-sm">Add family ({{ result.family_count }})</button>
        </form>
        {% endif %}
    </li>
{% endfor %}
</ul>
{% else %}
    <p class="muted-text">No matching people found.</p>
{% endif %}

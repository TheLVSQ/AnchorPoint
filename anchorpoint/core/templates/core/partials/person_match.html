<div class="detail-card match-box">
    <p class="mb-2"><strong>Person record found:</strong> {{ person.first_name }} {{ person.last_name }}
    {% if person.email %}<span class="stat-hint"> &middot; {{ person.email }}</span>{% endif %}</p>
    <label class="check-inline">
        <input type="checkbox" name="link_person" value="{{ person.pk }}" checked>
        Link this user account to {{ person.first_name }}'s Person record
    </label>
</div>

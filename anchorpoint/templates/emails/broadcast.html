{% extends "emails/base.html" %}
{% block content %}
<div style="color: #444444; line-height: 1.6; font-size: 15px;">{{ comm.body|linebreaks }}</div>
{% if unsubscribe_url %}
<p style="color: #999999; font-size: 12px; margin: 32px 0 0;">
  Don't want these emails? <a href="{{ unsubscribe_url }}" style="color: #999999;">Unsubscribe</a>.
</p>
{% endif %}
{% endblock %}

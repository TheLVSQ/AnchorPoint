{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
    {% if page_obj.has_previous %}
        <a class="btn ghost btn-sm" href="?page={{ page_obj.previous_page_number }}{% for key, value in request.GET.items %}{% if key != 'page' %}&amp;{{ key|urlencode }}={{ value|urlencode }}{% endif %}{% endfor %}">&larr; Previous</a>
    {% else %}
        <span class="btn ghost btn-sm" aria-disabled="true">&larr; Previous</span>
    {% endif %}
    <span class="muted-text">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
        <a class="btn ghost btn-sm" href="?page={{ page_obj.next_page_number }}{% for key, value in request.GET.items %}{% if key != 'page' %}&amp;{{ key|urlencode }}={{ value|urlencode }}{% endif %}{% endfor %}">Next &rarr;</a>
    {% else %}
        <span class="btn ghost btn-sm" aria-disabled="true">Next &rarr;</span>
    {% endif %}
</nav>
{% endif %}

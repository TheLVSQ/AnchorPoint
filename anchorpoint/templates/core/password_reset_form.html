{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="auth-card__brand">
        <h1>Forgot password?</h1>
        <p class="muted-text">We'll email you a link to set a new one.</p>
    </div>
    <form method="post">
        {% csrf_token %}
        <div class="form-field">
            <label for="id_email">Your sign-in email</label>
            <input id="id_email" type="email" name="email" required autocomplete="email" value="{{ form.email.value|default:'' }}">
            {% for error in form.email.errors %}<span class="error-text">{{ error }}</span>{% endfor %}
        </div>
        <button type="submit" class="btn btn-block">Email me a link</button>
    </form>
    <p class="auth-card__foot"><a href="{% url 'login' %}">Back to sign in</a></p>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Settings</h1>
    <p class="page-subtitle">Preferences for {{ settings_instance.name|default:"your church" }}.</p>
</div>
<div class="report-grid">
    {% for section in settings_sections %}
        <a class="report-card" href="{% url section.url %}">
            <h2>{{ section.title }}</h2>
            <p>{{ section.description }}</p>
            <span class="ghost-link">Open →</span>
        </a>
    {% endfor %}
</div>
{% endblock %}

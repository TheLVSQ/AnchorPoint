{% extends "base.html" %}
{% block title %}Check your email{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="auth-card__brand">
        <h1>Check your email</h1>
    </div>
    <p>If that address has a login, a link to set your password is on its way. It can take a few minutes, so check your spam folder too.</p>
    <p class="auth-card__foot"><a href="{% url 'login' %}">Back to sign in</a></p>
</div>
{% endblock %}

<div id="blast-stats"
     {% if blast.status == "processing" %}
     hx-get="{% url 'messaging:phone_blast_stats' blast.pk %}"
     hx-trigger="every 5s"
     hx-swap="outerHTML"
     {% endif %}>
    <div class="progress-row">
        <span class="muted-text">{{ stats.settled }} of {{ stats.total }} call{{ stats.total|pluralize }} settled</span>
        <span class="muted-text">{{ stats.percent }}%</span>
    </div>
    <progress class="progress" max="100" value="{{ stats.percent }}">{{ stats.percent }}%</progress>

    <div class="stat-grid">
        <div class="stat-card"><p class="stat-label">Answered</p><p class="stat-value text-success">{{ stats.answered }}</p></div>
        <div class="stat-card"><p class="stat-label">No answer</p><p class="stat-value">{{ stats.no_answer }}</p></div>
        <div class="stat-card"><p class="stat-label">Failed</p><p class="stat-value text-danger">{{ stats.failed }}</p></div>
        <div class="stat-card"><p class="stat-label">Pending</p><p class="stat-value text-warning">{{ stats.pending }}</p></div>
    </div>
</div>

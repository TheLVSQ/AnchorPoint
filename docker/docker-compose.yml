x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    logging: *default-logging
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:8000"
    volumes:
      - media_data:/app/anchorpoint/media
    env_file:
      - .env.production
    # Uncomment to allow Django to access a USB-connected printer:
    # devices:
    #   - /dev/usb/lp0:/dev/usb/lp0
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Scheduler sidecar: delivers due scheduled SMS/phone blasts every minute and
  # purges old phone-blast audio daily. Shares the web image, env, and media
  # volume. Skips the migration entrypoint (web owns migrations).
  cron:
    logging: *default-logging
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    entrypoint: ["/app/as-app.sh", "/app/cron.sh"]
    volumes:
      - media_data:/app/anchorpoint/media
      # Host maintenance status written by docker/hoststatus.sh (root cron on
      # the droplet); read by `manage.py system_health`. Read-only.
      - /var/lib/anchorpoint-host:/hoststatus:ro
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy

  # Daily DB backup sidecar. Dumps to ./backups on the host (a bind mount, so it
  # survives `docker compose down -v`) and prunes old dumps. Uses postgres:16 so
  # pg_dump matches the server. Off-box copy (Spaces/snapshot) still recommended.
  backup:
    logging: *default-logging
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - ./backups:/backups
      - ./backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

  db:
    logging: *default-logging
    container_name: anchorpoint-postgres
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  media_data:
